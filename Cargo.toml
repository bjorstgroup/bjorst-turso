[package]
name = "bjorst-turso"
version = "0.2.0"
edition = "2021"
authors = ["Bjorst Engineering <engineering@bjorst.com>"]
license = "MIT"
description = "Turso client over Hrana/HTTP (no libsql remote stack), a local libSQL mode for tests, and a migration runner"

[dependencies]
# Local databases only: the `remote` feature drags in rustls 0.22 / h2 0.3,
# which carry open RustSec advisories.
libsql = { version = "0.9", default-features = false, features = ["core"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
